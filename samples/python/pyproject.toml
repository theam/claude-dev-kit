[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-kit-python-sample"
version = "0.1.0"
description = "Minimal Python project exercising the kit's lint + unit + coverage gates in CI — the Python row of the stack matrix (#50)."
license = { text = "Apache-2.0" }
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["dev_kit_sample"]

[tool.coverage.report]
show_missing = true
fail_under = 95
