name: Stacks

# Real-world half of #50: run each stack profile's documented commands against a
# small sample project, so a profile that goes stale fails CI loudly instead of
# silently degrading the kit for that stack. (The completeness half is
# scripts/stack-profiles.test.mjs in the main CI.) One job per stack; adding a
# stack is a sample directory plus a job here.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'samples/**'
      - 'instructions/stacks/**'
      - 'scripts/check-clover.mjs'
      - '.github/workflows/stacks.yml'

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/php
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: pcov

      # The three steps below run the PHP profile's own commands
      # (instructions/stacks/php.md) — editing the profile without keeping
      # them true breaks this job, which is the point. The coupling is manual:
      # these commands are copies, so a profile edit must update them (and vice
      # versa) — reviewers, hold that line until a step derives them from the
      # profile itself.
      - name: Install (profile command)
        run: composer install --no-interaction --no-progress

      - name: Unit tests with coverage (profile command, PCOV driver)
        run: vendor/bin/phpunit --coverage-clover coverage.xml

      - name: Enforce the kit's coverage bar (default ≥ 95% per file)
        run: node ../../scripts/check-clover.mjs coverage.xml 95

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # The steps below run the Python profile's own commands
      # (instructions/stacks/python.md) — same manual coupling as the php job:
      # these are copies, so a profile edit must update them (and vice versa).
      - name: Install (profile command)
        run: pip install -e '.[dev]'

      - name: Lint + format check (profile commands)
        run: |
          ruff check .
          ruff format --check .

      # pytest-cov emits Cobertura, which the kit's per-file check-clover.mjs
      # gate cannot parse, so the bar is enforced inline exactly as the profile
      # documents (--cov-fail-under + [tool.coverage.report] fail_under) —
      # repo-wide rather than per-file. A per-file Cobertura gate is a natural
      # follow-up if the matrix wants parity with the php row.
      - name: Unit tests with coverage bar (profile command)
        run: pytest --cov=dev_kit_sample --cov-branch --cov-report=xml --cov-report=term-missing --cov-fail-under=95
