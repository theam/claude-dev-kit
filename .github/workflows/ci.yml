name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # 1. The committed bundle must be valid and in sync with its sources.
      - name: Validate the plugin bundle
        run: node scripts/validate-codex-plugin.mjs

      # 2. Zero-dep test suite (node:test): drift guard + PR-create detector + contract parity + plan-trio phrases + delegation provider.
      - name: Run tests
        run: node --test scripts/*.test.mjs

      # 3. Rebuilding must be a no-op on a committed tree — proves the bundle and the
      #    generated manifests match their canonical sources (skip-build drift = failure).
      - name: Rebuild and assert no drift
        run: |
          node scripts/build-codex-plugin.mjs
          git diff --exit-code

  # Not marked required. This file does not list required checks.
  # Branch protection is a maintainer action, separate from this job.
  forbid-version-file:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # chore/release-* with a chore(release): commit is the release exemption.
      # Feature branches fail. GITHUB_HEAD_REF supplies the branch name.
      - name: Fail when the version file is in the diff
        run: node scripts/check-version-file.mjs "${{ github.event.pull_request.base.sha }}"
